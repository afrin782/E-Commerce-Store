<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LUQAF - Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <header>

        <h2>LUQAF</h2>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="orders.html">
                Orders
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <main class="register-page">


        <div class="form-container">

            <h1>
                Create Account
            </h1>


            <form onsubmit="register(); return false;">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p id="registerMessage"></p>


        </div>


    </main>


    <script src="script.js"></script>

</body>

</html>
